# OptiMat Alloys — GPU version
# Requires: NVIDIA GPU + up-to-date NVIDIA drivers (Docker Desktop on Windows
# uses the WSL2 NVIDIA runtime — no separate nvidia-container-toolkit needed).
#
# Usage (Windows PowerShell, macOS/Linux terminal):
#   1. Place this file in any folder (e.g. C:\OptiMat-Alloys)
#   2. Open PowerShell in that folder:
#        cd C:\OptiMat-Alloys
#   3. Pull the image and start the container:
#        docker compose -f docker-compose-gpu.yml up
#   4. Open http://localhost:8000 in your browser
#   5. To stop:   docker compose -f docker-compose-gpu.yml stop
#      To resume: docker compose -f docker-compose-gpu.yml start
#
# Prefer `stop`/`start` over `down`/`up`. The MACE and ORB weights are
# downloaded on first use into the container itself, so deleting the container
# discards them and the next start downloads them again — several hundred MB,
# and the first calculation waits for it. `stop` keeps the container, so the
# download happens once. Pressing Ctrl-C in the terminal running `up` is also
# only a stop, and is safe.
#
# Use `down` when you actually want the container gone, e.g. before pulling a
# new image version. Nothing you have computed is lost either way: the
# structures database, the Ollama models and the compiled NequIP models are all
# in named volumes, which survive `down`.
#
# Note: The Docker Desktop GUI's "Run" dialog launches single images and
# does not read compose files at all. To use this file you MUST use the
# `docker compose -f docker-compose-gpu.yml ...` CLI. The running container
# will then appear in Docker Desktop's Containers tab, where the stop and start
# buttons behave exactly like the commands above and are safe to use. Deleting
# the container there is the equivalent of `down` — the same re-download
# applies.
#
services:
  optimat-alloys:
    image: ghcr.io/optimat-chat/optimat-alloys:latest
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_CONTEXT_LENGTH=32768  # 32K context — supports long multi-turn agent conversations. May stress low-VRAM systems (see SETUP_GUIDE for hardware notes).
      # API keys — picked up from your shell environment or a .env file placed
      # next to this compose file (all optional; keys can also be entered in the
      # chat UI at startup):
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - alloy-data:/app/structures
      - ollama-models:/root/.ollama
      # Compiled NequIP models. The image declares this path as a VOLUME, so
      # without naming it here Docker creates a fresh anonymous volume on every
      # run: each NequIP model is re-downloaded and recompiled for the device at
      # first use, and the previous run's copy is left behind as an orphan. The
      # compiled artifact is device-specific, so the GPU and CPU builds coexist
      # in this cache rather than overwriting each other.
      - nequip-cache:/app/cache/nequip

volumes:
  alloy-data:
  ollama-models:
  nequip-cache:
